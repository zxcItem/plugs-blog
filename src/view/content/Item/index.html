{extend name='table'}

{block name="button"}

<!--{if auth("add")}-->
<button data-open='{:url("add")}' class='layui-btn layui-btn-sm layui-btn-primary'>添加文章内容</button>
<!--{/if}-->

<!--{if auth("remove")}-->
<a data-confirm="确定永久删除吗？" data-table-id="ItemContentTable" data-action='{:url("remove")}' data-rule="id#{id}" class='layui-btn layui-btn-sm layui-btn-primary'>批量删除</a>
<!--{/if}-->

{/block}

{block name="content"}
<div class="layui-tab layui-tab-card">
    <ul class="layui-tab-title">
        {foreach ['1'=>'文章管理','0'=>'草稿箱'] as $k=>$v}
        {if isset($status) and $status eq $k}
        <li class="layui-this" data-open="{:url('index')}?status={$k}">{$v}</li>
        {else}
        <li data-open="{:url('index')}?status={$k}">{$v}</li>
        {/if}{/foreach}
    </ul>
    <div class="layui-tab-content">
        {include file='content/item/index_search'}
        <table id="ItemContentTable" data-line="2" data-url="{:request()->url()}" data-target-search="form.form-search"></table>
    </div>
</div>

<script>
    $(function () {
        let $table = $('#ItemContentTable').layTable({
            even: true, height: 'full',
            sort: {field: 'sort desc,id', type: 'desc'},
            cols: [[
                {checkbox: true, fixed: true},
                {field: 'sort', title: '{:lang("排序权重")}', width: 100, align: 'center', sort: true, templet: '#SortInputTpl'},
                {
                    field: 'title', title: '商品名称', minWidth: 220, sort: true, templet: function (d) {
                        d.html = showTableImage(d.cover, false, 'sm')
                        d.showPayments = "{:url('plugin-blog/content.item/show')}"
                        return laytpl("<div class='flex'><div>{{-d.html}}</div>" +
                            "<a class='color-text' data-area = \"['1000px','1000px']\" data-modal=\"{{d.showPayments}}?id={{d.id}}\">" +
                            "<div class='ta-pl-10 nowrap'>标题：{{d.title}}" +
                            "</a>" +
                            "<br>编号：<b class='color-blue'>{{d.code}}</b></div></div>").render(d);
                    }
                },
                {
                    field: 'recommend', title: '推荐置顶', minWidth: 110, templet: function (d) {
                        if (d.recommend > 0) {
                            d.html = ' 推荐状态： <i class="layui-icon layui-icon-ok-circle color-red"></i><br>';
                        } else {
                            d.html = ' 推荐状态： <i class="layui-icon layui-icon-error"></i><br>';
                        }
                        if (d.top > 0){
                            d.html += ' 置顶状态： <i class="layui-icon layui-icon-ok-circle color-red"></i><br>';
                        }else {
                            d.html += ' 置顶状态： <i class="layui-icon layui-icon-error"></i><br>';
                        }
                        return d.html
                    }
                },
                {
                    field: 'views', title: '浏览量', minWidth: 140, sort: true, templet: function (d) {
                        let tpls = [];
                        tpls.push('实际浏览量： <b class=\'color-blue\'>{{d.views - d.virtual_view}}</b>');
                        tpls.push('虚拟浏览量： <b class=\'color-blue\'>{{d.virtual_view}}</b>');
                        return laytpl(tpls.join('<br>')).render(d);
                    }
                },
                {
                    field: 'likes', title: '点赞量', minWidth: 140, sort: true, templet: function (d) {
                        let tpls = [];
                        tpls.push('实际点赞量： <b class=\'color-blue\'>{{d.likes - d.virtual_like}}</b>');
                        tpls.push('虚拟点赞量： <b class=\'color-blue\'>{{d.virtual_like}}</b>');
                        return laytpl(tpls.join('<br>')).render(d);
                    }
                },
                {
                    field: 'comment', title: '评论状态', minWidth: 130, templet: function (d) {
                        if (d.comment > 0) {
                            d.html = ' 评论状态： <i class="layui-icon layui-icon-ok-circle color-red"></i><br>';
                        } else {
                            d.html = ' 评论状态： <i class="layui-icon layui-icon-error"></i><br>';
                        }
                        d.html += ' 评论数量： <b class=\'color-blue\'>{{d.comment_sum}}</b>';
                        return laytpl(d.html).render(d);
                    }
                },
                {
                    title: '标签分类',  minWidth: 150, templet: function (d) {
                        let tpls = '集合：' + (d.series.title ?? '-');
                        return tpls + '<br>标签：' + (d.mark.length > 0 ? d.mark.join('、') : '-');
                    }
                },
                {field: 'create_at', title: '创建时间', minWidth: 150, templet: "<div>更新：{{d.update_at}}<br>创建：{{d.create_at}}</div>"},
                {toolbar: '#toolbar', title: '操作面板', align: 'center', minWidth: 150, fixed: 'right'}
            ]]
        });
    });
</script>
<!-- 列表排序权重模板 -->
<script type="text/html" id="SortInputTpl">
    <input type="number" min="0" data-blur-number="0" data-action-blur="{:sysuri()}" data-value="id#{{d.id}};action#sort;sort#{value}" data-loading="false" value="{{d.sort}}" class="layui-input text-center">
</script>


<script type="text/html" id="toolbar">
    <!--{if auth("edit")} -->
    <a class="layui-btn layui-btn-sm" data-open='{:url("edit")}?id={{d.id}}'>编 辑</a>
    <!--{/if}-->
    <!--{if auth("remove")}-->
    <a class="layui-btn layui-btn-sm layui-btn-danger" data-confirm="确定要永久删除吗？" data-action="{:url('remove')}" data-value="id#{{d.id}}">删 除</a>
    <!--{/if}-->
</script>
{/block}
