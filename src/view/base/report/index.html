{extend name="main"}

{block name="button"}
<button data-modal='{:url("base.config/params")}' class='layui-btn layui-btn-sm layui-btn-primary'>基本参数配置</button>
{/block}

{block name='content'}
<div class="think-box-shadow portal-block-container notselect">
    <div class="layui-row layui-col-space15">
        <fieldset class="layui-col-sm6 layui-form-pane">
            <legend>博主资料</legend>
            <div class="layui-row layui-col-space15">
                <div class="layui-col-xs4">
                    <div class="layui-table">
                        <div class="headimg WechatUserHead" data-lazy-src="{$data.blogger_cover|default='__ROOT__/static/theme/img/headimg.png'}" data-tips-image style="height: 150px;width: 150px"></div>
                    </div>
                </div>
                <div class="layui-col-xs8">
                    <label class="layui-form-label layui-bg-gray">博主昵称</label>
                    <div class="layui-input-block">
                        <input value="{$data.blogger_nickname|default=''}" readonly class="layui-input layui-bg-gray">
                    </div>
                </div>
                <div class="layui-col-xs8">
                    <label class="layui-form-label layui-bg-gray">博主邮箱</label>
                    <div class="layui-input-block">
                        <input value="{$data.blogger_email|default=''}" readonly class="layui-input layui-bg-gray">
                    </div>
                </div>
                <div class="layui-col-xs8">
                    <label class="layui-form-label layui-bg-gray">社交电报</label>
                    <div class="layui-input-block">
                        <input value="{$data.blogger_telegram|default=''}" readonly class="layui-input layui-bg-gray">
                    </div>
                </div>
                <div class="layui-form-item layui-form-text">
                    <label class="layui-form-label layui-bg-gray">博主简介</label>
                    <div class="layui-input-block">
                        <textarea class="layui-textarea layui-bg-gray" readonly>{$data.blogger_describe|default=""}</textarea>
                    </div>
                </div>
            </div>
        </fieldset>
        <div class="layui-col-sm6 layui-col-md3">
            <div class="portal-block-item nowrap" style="background:linear-gradient(-125deg,#57bdbf,#2f9de2)">
                <div>文章总量</div>
                <div>{$ContentTotal|default='0'}</div>
                <div>当前文章总数量</div>
            </div>
            <i class="portal-block-icon layui-icon layui-icon-app"></i>
        </div>
        <div class="layui-col-sm6 layui-col-md3">
            <div class="portal-block-item nowrap" style="background:linear-gradient(-125deg,#ff7d7d,#fb2c95)">
                <div>分类总量</div>
                <div>{$SeriesTotal|default='0'}</div>
                <div>当前文章分类总数量</div>
            </div>
            <i class="portal-block-icon layui-icon layui-icon-user"></i>
        </div>
        <div class="layui-col-sm6 layui-col-md3">
            <div class="portal-block-item nowrap" style="background:linear-gradient(-113deg,#c543d8,#925cc3)">
                <div>标签总量</div>
                <div>{$MarkTotal|default='0'}</div>
                <div>当前文章标签总数量</div>
            </div>
            <i class="portal-block-icon layui-icon layui-icon-form"></i>
        </div>
        <div class="layui-col-sm6 layui-col-md3">
            <div class="portal-block-item nowrap" style="background:linear-gradient(-141deg,#ecca1b,#f39526)">
                <div>浏览总量</div>
                <div>{$RecordTotal|default='0'}</div>
                <div>当前文章浏览统计总数量</div>
            </div>
            <i class="portal-block-icon layui-icon layui-icon-rmb"></i>
        </div>
    </div>
</div>

<div class="layui-row layui-col-space15 ta-mt-10">

    <div class="layui-col-xs12 layui-col-md6">
        <div class="think-box-shadow">
            <div id="main2" style="width:100%;height:350px"></div>
        </div>
    </div>
    <div class="layui-col-xs12 layui-col-md6">
        <div class="think-box-shadow">
            <div id="main4" style="width:100%;height:350px"></div>
        </div>
    </div>

</div>

<label class="layui-hide">
    <textarea id="jsondata1">{$days|json_encode}</textarea>
    <textarea id="jsondata2">{$levels|json_encode}</textarea>
</label>

<script>

    require(['echarts'], function (echarts) {
        let data1 = JSON.parse($('#jsondata1').html());
        let days = data1.map(function (item) {
            return item['当天日期'];
        });

        let data2 = JSON.parse($('#jsondata2').html());
        let chart2 = echarts.init(document.getElementById('main2'));
        window.addEventListener("resize", function () {
            chart2.resize()
        });
        chart2.setOption({
            title: {text: '文章集合统计', left: 'center'},
            legend: {orient: 'vertical', left: 'left'},
            tooltip: {trigger: 'item', formatter: '{a} <br/>{b} : {c} 篇 ( {d}% )'},
            series: [
                {
                    name: '文章分类统计',
                    type: 'pie',
                    radius: '60%',
                    center: ['50%', '55%'],
                    data: data2.map(function (item) {
                        return {name: item.title, value: item.count}
                    }),
                    emphasis: {
                        itemStyle: {
                            shadowBlur: 10,
                            shadowOffsetX: 0,
                            shadowColor: 'rgba(0, 0, 0, 0.5)'
                        }
                    }
                }
            ]
        });

        (function (charts) {
            window.addEventListener("resize", function () {
                charts.resize()
            });
            charts.setOption({
                title: [{left: 'center', text: '近十天文章访问趋势'}],
                tooltip: {trigger: 'axis', show: true, axisPointer: {type: 'cross', label: {}}},
                xAxis: [{data: days, gridIndex: 0}],
                yAxis: [
                    {
                        splitLine: {show: true}, gridIndex: 0, type: 'value', axisLabel: {
                            formatter: '{value}'
                        }
                    }
                ],
                grid: [{left: '10%', right: '3%', top: '25%'}],
                series: [
                    {
                        smooth: true, showBackground: true,
                        areaStyle: {color: 'rgba(180, 180, 180, 0.5)'},
                        type: 'line', showSymbol: true, xAxisIndex: 0, yAxisIndex: 0,
                        label: {normal: {position: 'top', formatter: '{c}', show: true}},
                        data: data1.map(function (item) {
                            return item['文章访问'];
                        }),
                    }
                ]
            });
        })(echarts.init(document.getElementById('main4')));
    });
</script>

{/block}
